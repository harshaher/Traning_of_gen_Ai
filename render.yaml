# ==============================================================================
# ShellSathi - Render Infrastructure-as-Code Blueprint
# ==============================================================================
# Service: shellsathi-ui (Streamlit Frontend Web Service)
# Connects to the existing, already deployed FastAPI backend at:
# https://shellsathi-api.onrender.com
#
# NOTE: The backend service (shellsathi-api) is already deployed as a standalone
# service on Render at https://shellsathi-api.onrender.com. To avoid creating
# duplicate services and wasting free instance quota, only the frontend is
# declared below.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # ShellSathi Streamlit Interactive Web Interface
  # ----------------------------------------------------------------------------
  - type: web
    name: shellsathi-ui
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.ui
    dockerCommand: sh -c "exec streamlit run ui/app.py --server.port ${PORT:-8501} --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false --server.enableCORS false --server.enableXsrfProtection false"
    plan: free
    region: oregon
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8501
      - key: BACKEND_URL
        value: https://shellsathi-api.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"

  # ----------------------------------------------------------------------------
  # (Reference Only) Existing Deployed Backend Service
  # Existing URL: https://shellsathi-api.onrender.com
  # Keep commented to prevent creating duplicate backend instances on Render.
