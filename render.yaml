# ==============================================================================
# ShellSathi - Render Infrastructure-as-Code Blueprint
# ==============================================================================
# Declares both production services for Render Web Service deployment:
#   1. shellsathi-api: FastAPI backend with ChromaDB (port 8000)
#   2. shellsathi-ui:  Streamlit interactive frontend (port 8501)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: ShellSathi FastAPI REST API Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: shellsathi-api
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.api
    dockerCommand: sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Service 2: ShellSathi Streamlit Interactive Web Interface Frontend
  # ----------------------------------------------------------------------------
  - type: web
    name: shellsathi-ui
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.ui
    dockerCommand: sh -c "exec streamlit run ui/app.py --server.port ${PORT:-8501} --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false --server.enableCORS false --server.enableXsrfProtection false"
    plan: free
    region: oregon
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8501
      - key: BACKEND_URL
        value: https://shellsathi-api.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
